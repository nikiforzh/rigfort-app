<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RigFort Workspace</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f1115);
            --card-bg: var(--tg-theme-secondary-bg-color, #1a1d24);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8b92a0);
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-blue: #3498db;
            --border-color: rgba(255, 255, 255, 0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px 16px 85px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .badge {
            background: rgba(52, 152, 219, 0.15);
            color: var(--accent-blue);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 14px;
        }

        .tab-content.active {
            display: flex;
        }

        .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .profile-row:last-child {
            border-bottom: none;
        }

        .profile-label { color: var(--hint-color); }
        .profile-val { font-weight: 600; text-align: right; }

        .timer-card {
            text-align: center;
            padding: 24px 16px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--hint-color);
        }

        .status-dot.active {
            background-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .timer-val {
            font-size: 42px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            margin-bottom: 12px;
        }

        .progress-box {
            background: rgba(255, 255, 255, 0.08);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2ecc71, #3498db);
            transition: width 0.3s ease;
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--hint-color);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn:active { transform: scale(0.98); }
        .btn-green { background: linear-gradient(135deg, #2ecc71, #27ae60); color: #fff; }
        .btn-red { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            margin-top: 8px;
            padding: 12px;
            font-size: 14px;
        }

        .sched-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .sched-btn {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-color);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .sched-btn.selected {
            border-color: var(--accent-blue);
            background: rgba(52, 152, 219, 0.15);
            color: var(--accent-blue);
        }

        .tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 16px;
            z-index: 100;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: var(--hint-color);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .tab-item.active { color: var(--accent-blue); }
        .tab-item span { font-size: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏢 RIGFORT</h1>
        <div class="badge">WORKSPACE APP</div>
    </div>

    <!-- 1. ВКЛАДКА: СМЕНА -->
    <div class="tab-content active" id="tab-shift">
        <div class="card timer-card">
            <div class="status-pill">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Не на смене</span>
            </div>

            <div class="timer-val" id="timerDisplay">00:00:00</div>

            <div class="progress-box">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="progress-meta">
                <span id="startMeta">Старт: 08:00</span>
                <span id="percentLabel">0%</span>
                <span id="endMeta">Конец: 17:00</span>
            </div>
        </div>

        <button class="btn btn-green" id="shiftActionBtn" onclick="toggleShift()">
            🟢 Начать смену
        </button>
    </div>

    <!-- 2. ВКЛАДКА: ПРОФИЛЬ -->
    <div class="tab-content" id="tab-profile">
        <div class="card">
            <h3 style="font-size: 14px; margin-bottom: 10px; color: var(--hint-color);">СОТРУДНИК RIGFORT</h3>
            <div class="profile-row">
                <span class="profile-label">ФИО</span>
                <span class="profile-val" id="profileFio">Иванов Никифор</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Должность</span>
                <span class="profile-val" id="profilePos">Разработчик</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Дата рождения</span>
                <span class="profile-val" id="profileBirth">15.04.1995</span>
            </div>
        </div>

        <div class="card">
            <h3 style="font-size: 14px; margin-bottom: 6px; color: var(--hint-color);">СМЕНА ГРАФИКА</h3>
            <div class="sched-grid">
                <button class="sched-btn" id="btnSched7" onclick="setSchedule('7-15')">⏰ 07:00 — 15:00</button>
                <button class="sched-btn" id="btnSched8" onclick="setSchedule('8-17')">⏰ 08:00 — 17:00</button>
            </div>
        </div>

        <div class="card">
            <h3 style="font-size: 14px; margin-bottom: 10px; color: var(--hint-color);">СТАТИСТИКА ЧАСОВ</h3>
            <div class="profile-row">
                <span class="profile-label">Этот месяц</span>
                <span class="profile-val" id="profileMonth">0 ч. 0 мин.</span>
            </div>
            <button class="btn btn-outline" onclick="resetMonth()">🔄 Сбросить часы за месяц</button>
        </div>
    </div>

    <!-- НИЖНИЙ ТАБ-БАР -->
    <div class="tabbar">
        <button class="tab-item active" id="navShift" onclick="switchTab('tab-shift')">
            <span>🏠</span>Смена
        </button>
        <button class="tab-item" id="navProfile" onclick="switchTab('tab-profile')">
            <span>👤</span>Профиль
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // ================= СОСТОЯНИЕ В ПАМЯТИ ТЕЛЕФОНА =================
        let isWorking = localStorage.getItem('rf_is_working') === 'true';
        let shiftStartTime = parseInt(localStorage.getItem('rf_shift_start') || '0');
        let currentSchedule = localStorage.getItem('rf_schedule') || '8-17';
        let monthSeconds = parseInt(localStorage.getItem('rf_month_seconds') || '0');
        let timerInterval = null;

        // Инициализируем экран
        updateScheduleUI();
        updateMonthUI();

        if (isWorking && shiftStartTime > 0) {
            startTimerUI();
        } else {
            stopTimerUI();
        }

        // ================= НАЖАТИЕ: СТАРТ / СТОП СМЕНЫ =================
        function toggleShift() {
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');

            if (!isWorking) {
                // НАЧИНАЕМ СМЕНУ (ОКНО НЕ ЗАКРЫВАЕТСЯ!)
                isWorking = true;
                shiftStartTime = Date.now();
                localStorage.setItem('rf_is_working', 'true');
                localStorage.setItem('rf_shift_start', shiftStartTime.toString());

                startTimerUI();
            } else {
                // ЗАВЕРШАЕМ СМЕНУ (ОКНО НЕ ЗАКРЫВАЕТСЯ!)
                const elapsedSecs = Math.floor((Date.now() - shiftStartTime) / 1000);
                monthSeconds += elapsedSecs;
                localStorage.setItem('rf_month_seconds', monthSeconds.toString());

                isWorking = false;
                shiftStartTime = 0;
                localStorage.setItem('rf_is_working', 'false');
                localStorage.removeItem('rf_shift_start');

                stopTimerUI();
                updateMonthUI();

                const h = Math.floor(elapsedSecs / 3600);
                const m = Math.floor((elapsedSecs % 3600) / 60);
                alert(`🔴 Смена успешно завершена!\n⏱ Отработано сегодня: ${h} ч. ${m} мин.`);
            }
        }

        function startTimerUI() {
            const btn = document.getElementById('shiftActionBtn');
            btn.className = 'btn btn-red';
            btn.innerText = '🔴 Завершить смену';
            document.getElementById('statusDot').className = 'status-dot active';
            document.getElementById('statusText').innerText = 'На смене (в работе)';

            clearInterval(timerInterval);
            timerInterval = setInterval(tick, 1000);
            tick();
        }

        function stopTimerUI() {
            clearInterval(timerInterval);
            const btn = document.getElementById('shiftActionBtn');
            btn.className = 'btn btn-green';
            btn.innerText = '🟢 Начать смену';
            document.getElementById('statusDot').className = 'status-dot';
            document.getElementById('statusText').innerText = 'Не на смене (отдых)';
            document.getElementById('timerDisplay').innerText = '00:00:00';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('percentLabel').innerText = '0%';
        }

        function tick() {
            if (!shiftStartTime) return;
            const elapsed = Math.floor((Date.now() - shiftStartTime) / 1000);

            const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
            const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
            const s = String(elapsed % 60).padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${h}:${m}:${s}`;

            const plannedHours = (currentSchedule === '7-15') ? 8 : 9;
            const percent = Math.min(100, Math.floor((elapsed / (plannedHours * 3600)) * 100));
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('percentLabel').innerText = percent + '%';
        }

        // ================= ГРАФИК И ПРОФИЛЬ =================
        function setSchedule(sched) {
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            currentSchedule = sched;
            localStorage.setItem('rf_schedule', sched);
            updateScheduleUI();
        }

        function updateScheduleUI() {
            document.getElementById('btnSched7').className = 'sched-btn ' + (currentSchedule === '7-15' ? 'selected' : '');
            document.getElementById('btnSched8').className = 'sched-btn ' + (currentSchedule === '8-17' ? 'selected' : '');

            document.getElementById('startMeta').innerText = 'Старт: ' + (currentSchedule === '7-15' ? '07:00' : '08:00');
            document.getElementById('endMeta').innerText = 'Конец: ' + (currentSchedule === '7-15' ? '15:00' : '17:00');
        }

        function resetMonth() {
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
            if (confirm("Вы точно хотите обнулить отработанные часы за этот месяц?")) {
                monthSeconds = 0;
                localStorage.setItem('rf_month_seconds', '0');
                updateMonthUI();
            }
        }

        function updateMonthUI() {
            const h = Math.floor(monthSeconds / 3600);
            const m = Math.floor((monthSeconds % 3600) / 60);
            document.getElementById('profileMonth').innerText = `${h} ч. ${m} мин.`;
        }

        // ================= НАВИГАЦИЯ ПО ТАБАМ =================
        function switchTab(tabId) {
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            if (tabId === 'tab-shift') document.getElementById('navShift').classList.add('active');
            if (tabId === 'tab-profile') document.getElementById('navProfile').classList.add('active');
        }
    </script>
</body>
</html>
